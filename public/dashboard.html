<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Crânios IMOB</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--surface-light);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .trend-up {
            color: var(--success);
        }

        .trend-down {
            color: var(--error);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .agent-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: var(--surface-light);
            border-radius: 0.5rem;
        }

        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .agent-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .agent-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-badge {
            margin-left: auto;
            padding: 0.25rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-busy {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">Crânios IMOB Dashboard</div>
            <div style="display: flex; gap: 1rem;">
                <button onclick="window.location.href='/'"
                    style="padding: 0.5rem 1rem; background: var(--surface-light); border: none; color: white; border-radius: 0.5rem; cursor: pointer;">Ir
                    para Chat</button>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <div style="width: 10px; height: 10px; background: var(--success); border-radius: 50%;"></div>
                    System Online
                </div>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid" id="kpi-grid">
            <div class="card">
                <div class="stat-label">Total Imóveis</div>
                <div class="stat-value" id="total-imoveis">-</div>
                <div class="stat-trend trend-up"><i class="ri-arrow-up-line"></i> 12% vs mês anterior</div>
            </div>
            <div class="card">
                <div class="stat-label">Leads Ativos</div>
                <div class="stat-value" id="total-leads">-</div>
                <div class="stat-trend trend-up"><i class="ri-arrow-up-line"></i> 8 novos hoje</div>
            </div>
            <div class="card">
                <div class="stat-label">Agendamentos</div>
                <div class="stat-value" id="total-agendamentos">-</div>
                <div class="stat-trend trend-up"><i class="ri-calendar-check-line"></i> Próximos 7 dias</div>
            </div>
            <div class="card">
                <div class="stat-label">Vendas (Mês)</div>
                <div class="stat-value" id="total-vendas">R$ 2.4M</div>
                <div class="stat-trend trend-up"><i class="ri-money-dollar-circle-line"></i> Meta batida</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-grid">
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Desempenho de Vendas & Leads</h3>
                <div class="chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
            <div class="card" style="grid-column: span 1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Corretores e Roleta</h3>
                    <button onclick="abrirModalConvite()"
                        style="padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem;">+
                        Convidar</button>
                </div>

                <div class="agent-list" id="lista-corretores">
                    <p style="text-align:center; color: var(--text-muted); font-size: 0.9rem;">Carregando corretores...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Convite Corretor -->
    <div id="modal-convite"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div
            style="background: var(--surface); padding: 2rem; border-radius: 1rem; width: 100%; max-width: 400px; border: 1px solid var(--surface-light);">
            <h3 style="margin-bottom: 1rem;">Convidar Novo Corretor</h3>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Nome
                    do Corretor</label>
                <input type="text" id="convite-nome"
                    style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--background); border: 1px solid var(--surface-light); color: white;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label
                    style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Email</label>
                <input type="email" id="convite-email"
                    style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: var(--background); border: 1px solid var(--surface-light); color: white;">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button onclick="fecharModalConvite()"
                    style="padding: 0.5rem 1rem; background: transparent; color: var(--text-muted); border: none; cursor: pointer;">Cancelar</button>
                <button onclick="enviarConvite()"
                    style="padding: 0.5rem 1rem; background: var(--success); color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Enviar
                    Convite</button>
            </div>
        </div>
    </div>

    <script>
        // Fetch Dashboard Data
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('total-imoveis').textContent = stats.totalImoveis;
                    document.getElementById('total-leads').textContent = stats.leads;
                    document.getElementById('total-agendamentos').textContent = stats.agendamentos;
                    document.getElementById('total-vendas').textContent = 'R$ 2.4M'; // Mock

                    updateCharts(stats);
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Fetch Corretores e Gerenciar Roleta
        async function loadCorretores() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const clienteId = urlParams.get('cliente_id') || '';

                const response = await fetch('/api/corretores' + (clienteId ? `?cliente_id=${clienteId}` : ''));
                const resData = await response.json();

                if (resData.success) {
                    const container = document.getElementById('lista-corretores');
                    container.innerHTML = ''; // Limpa

                    if (resData.corretores.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size: 0.9rem;">Nenhum corretor cadastrado.</p>';
                        return;
                    }

                    resData.corretores.forEach(c => {
                        const avatar = `https://api.dicebear.com/7.x/initials/svg?seed=${c.nome}`;
                        const isInRoleta = c.na_roleta;

                        // Layout do item de corretor
                        const itemHtml = `
                            <div class="agent-item" style="flex-wrap: wrap;">
                                <img src="${avatar}" class="agent-avatar">
                                <div class="agent-info" style="flex: 1; min-width: 150px;">
                                    <h4>${c.nome}</h4>
                                    <p>Leads mês: ${c.total_leads_recebidos}</p>
                                </div>
                                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                                    <div style="display: flex; align-items: center; gap: 0.25rem;">
                                        <label title="Participa do sorteio na IA" style="font-size: 0.7rem; color: var(--text-muted);">Na Roleta</label>
                                        <input type="checkbox" ${isInRoleta ? 'checked' : ''} onchange="toggleRoleta('${c.id}', this.checked)" style="accent-color: var(--primary);">
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.25rem; background: var(--background); padding: 0.2rem 0.5rem; border-radius: 0.25rem;">
                                        <label title="Prioridade de recebimento (1 = Normal, 2 = Dobro)" style="font-size: 0.7rem; color: var(--text-muted);">Peso</label>
                                        <input type="number" id="peso-${c.id}" value="${c.peso_roleta}" min="0" max="10" style="width: 40px; background: transparent; border: 1px solid var(--surface-light); color: white; text-align: center; border-radius: 0.2rem;">
                                        <button onclick="salvarPeso('${c.id}')" title="Salvar peso" style="background: transparent; border: none; color: var(--success); cursor: pointer;"><i class="ri-save-line"></i></button>
                                    </div>
                                    <span class="status-badge ${c.ativo ? 'status-active' : 'status-busy'}">
                                        ${c.ativo ? 'Ativo' : 'Inativo'}
                                    </span>
                                </div>
                            </div>
                        `;
                        container.innerHTML += itemHtml;
                    });
                }
            } catch (error) {
                console.error('Error loading corretores:', error);
            }
        }

        // Ações de Atualização
        async function toggleRoleta(id, isChecked) {
            try {
                await fetch(`/api/corretores/${id}/roleta`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ na_roleta: isChecked })
                });
            } catch (e) { console.error(e); }
        }

        async function salvarPeso(id) {
            try {
                const peso = parseFloat(document.getElementById(`peso-${id}`).value) || 1;
                await fetch(`/api/corretores/${id}/roleta`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peso_roleta: peso })
                });
                alert('Peso atualizado na roleta!');
                loadCorretores();
            } catch (e) { console.error(e); }
        }

        // Modal Convite
        function abrirModalConvite() {
            document.getElementById('modal-convite').style.display = 'flex';
        }
        function fecharModalConvite() {
            document.getElementById('modal-convite').style.display = 'none';
        }

        async function enviarConvite() {
            const nome = document.getElementById('convite-nome').value;
            const email = document.getElementById('convite-email').value;
            if (!nome || !email) return alert('Preencha nome e email!');

            const urlParams = new URLSearchParams(window.location.search);
            const clienteId = urlParams.get('cliente_id');

            try {
                const response = await fetch('/api/corretores/convite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, cliente_id: clienteId })
                });
                const res = await response.json();
                if (res.success) {
                    alert('Convite enviado com sucesso para o email do corretor!');
                    fecharModalConvite();
                } else {
                    alert('Erro ao enviar: ' + res.error);
                }
            } catch (e) { console.error(e); }
        }

        // Initialize Charts (Mock/Setup)
        function updateCharts(stats) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
                    datasets: [{
                        label: 'Leads',
                        data: [12, 19, 3, 5, 2, 3].map(x => x * (stats.leads > 0 ? stats.leads / 10 : 1)),
                        borderColor: '#6366f1',
                        tension: 0.4
                    }, {
                        label: 'Vendas',
                        data: [2, 3, 5, 1, 2, 4],
                        borderColor: '#ec4899',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        // Boot
        loadDashboardData();
        loadCorretores();
    </script>
</body>

</html>
