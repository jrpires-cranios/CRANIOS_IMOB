[phases.setup]
# apt-get instala o Chromium real no container Debian/Ubuntu do nixpacks
# (não usa snap — funciona corretamente em Docker)
aptPkgs = [
  "chromium-browser",
  "fonts-liberation",
  "fonts-noto-color-emoji",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0",
  "libnss3",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2",
  "libxss1",
  "xdg-utils"
]

[phases.build]
cmds = ["npm install", "npm run build"]

[phases.start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium-browser"
